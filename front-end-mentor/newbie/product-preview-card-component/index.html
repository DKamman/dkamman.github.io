<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>
      <div class="container">

        <article class="card">

          <picture class="card__image-wrapper">
            <source media="(min-width:768px)" srcset="images/image-product-desktop.jpg">
            <img src="images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum" class="card__image">
          </picture>

          <div class="card__content">

            <header>
              <hgroup>
                <p class="card__subtitle">Perfume</p>
                <h3 class="card__title">Gabrielle Essence Eau De Parfum</h3>
              </hgroup>
            </header>

            <p class="card__description">A floral, solar and voluptuous interpretation composed by Oliver Polge, Perfumer-Creator for the House of CHANEL</p>

            <footer>
              <div class="card__price-box">
                <div class="card__price-box-current">
                  <span class="sr-only">Huidige prijs:</span>
                  <span>$149.99</span>
                </div>
                <div class="card__price-box-previous">
                  <span class="sr-only">Originele prijs:</span>
                  <del>$169.99</del>
                </div>
              </div>

              <div class="btn-group">
                <a href="#" class="btn card__btn">
                  <img src="images/icon-cart.svg" alt="">
                  <span>Add to cart</span>
                </a>
              </div>
            </footer>

          </div>

        </article>

      </div>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');

    :root {
      /* Primary */
      --green-500: hsl(158, 36%, 37%);
      --green-700: hsl(158, 42%, 18%);

      /* Neutral */
      --black: hsl(212, 21%, 14%);
      --grey: hsl(228, 12%, 48%);
      --cream: hsl(30, 38%, 92%);
      --white: hsl(0, 0%, 100%);
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;

      outline-offset: 2px;
    }

    html {
      font-size: 62.5%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      font-size: 1.4rem;
      font-family: "Montserrat", sans-serif;
    }

    h1, h2, h3, h4, h5 {
      font-family: "Fraunces", serif;
    }

    a {
      text-decoration: none;
    }

    main {
      height: clamp(100svh, 100svh, 100svh);
      background-color: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 620px;
      width: 90%;
      margin-left: auto;
      margin-right: auto;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      background-color: var(--green-500);
      color: var(--white);
      padding: 16px 16px;
      border-radius: 8px;

      font-weight: 500;

      transition: all .2s ease;
    }

    .btn:hover, .btn:focus-visible {
      background-color: vaR(--green-700);
    }

    .card {
      border-radius: 0.8rem;
      overflow: hidden;

      display: flex;
      flex-direction: column;
    }

    .card__image-wrapper {
      position: relative;
    }

    .card__image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .card__content {
      background-color: var(--white);
      padding: 32px;
    }

    .card__subtitle {
      color: var(--grey);
      text-transform: uppercase;
      font-weight: 500;
      letter-spacing: 5px;
    }
    .card__title {
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--black);
      margin-top: 2.4rem;
    }

    .card__description {
      margin-top: 2.4rem;
      color: var(--grey);
      line-height: 1.5;
    }

    .card__price-box {
      position: relative;
      margin-top: 2.4rem;

      display: flex;
      align-items: center;
      gap: 1.6rem;
    }

    .card__price-box-current {
      font-size: 2.8rem;
      color: var(--green-500);
      font-weight: 700;
      font-family: "Fraunces", serif;
    }

    .card__price-box-previous {
      color: var(--grey);
    }

    .btn-group {
      margin-top: 2.4rem;
    }

    @media (min-width: 48em) {
      .card {
        flex-direction: row;
      }
      .card__image-wrapper {
        min-width: 50%;
      }
      .card__image {
        position: absolute;
      }
      .card__content {
        min-width: 50%;
      }
    }
  </style>
</body>
</html>
