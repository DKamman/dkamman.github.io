<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>

  <main>

    <article class="card">
      <figure class="card__image-wrapper">
        <img src="assets/images/illustration-article.svg" alt="Card image" class="card__image">
      </figure>

      <div class="card__badge">Learning</div>
      <div class="card__date">Published 21 Dec 2023</div>
      <h1 class="card__title">HTML & CSS foundations</h1>
      <p class="card__description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      <div class="card__author">
        <figure class="card__author-profile">
          <img src="assets/images/image-avatar.webp" alt="Greg Hooper">
        </figure>
        <p class="card__author-name">Greg Hooper</p>
      </div>
    </article>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Danny Kamman</a>.
  </footer>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap');

    :root {
      --yellow: hsl(47, 88%, 63%);
      --white: hsl(0, 0%, 100%);
      --gray-500: hsl(0, 0%, 42%);
      --gray-950: hsl(0, 0%, 7%);
    }

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      font-family: "Figtree";
    }

    main {
      height: 100vh;
      min-height: 100vh;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--yellow);
    }

    .card {
      width: 90%;
      max-width: 375px;

      border: 1px solid var(--gray-950);
      border-radius: 16px;
      overflow: hidden;

      padding: 24px;

      background-color: var(--white);

      box-shadow: 8px 8px 0px var(--gray-950);

      cursor: pointer;

      &:hover {
        .card__title {
          color: var(--yellow);
      }
    }

    .card__image-wrapper {
      border-radius: 8px;
      overflow: hidden;
    }

    .card__image {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card__badge {
      font-weight: 800;
      padding: 6px 12px;
      background-color: var(--yellow);
      border-radius: 6px;
      width: fit-content;
      margin-top: 24px;
      font-size: 0.9rem;
    }

    .card__date {
      margin-top: 12px;
    }

    .card__title {
      margin-top: 20px;
      font-size: 1.5rem;
      font-weight: 800;

      transition: color .2s ease;
    }

    .card__description {
      margin-top: 20px;
      color: var(--gray-500);
      line-height: 1.4;
    }

    .card__author {
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card__author-profile {
      width: 40px;
      height: 40px;

      img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    }

    .card__author-name {
      font-weight: 800;
    }
  </style>
</body>
</html>
